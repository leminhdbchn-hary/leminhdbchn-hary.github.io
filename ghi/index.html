<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ghi chi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghi chi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0d0c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=56">
<link rel="icon" type="image/png" href="../favicon.png?v=56">
<style>
  :root{--bg:#0e0d0c;--card:#1b1916;--line:#2e2a25;--text:#f3ede4;--sub:#a39a8c;--gold:#c29a5c;--ok:#3fb27f;--red:#e0483c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 24px)}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 20px}
  .box{display:flex;gap:10px}
  input{flex:1;min-width:0;font-size:20px;padding:16px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
  input:focus{border-color:var(--gold)}
  button{font:inherit;border:0;border-radius:14px;cursor:pointer}
  .go{background:var(--gold);color:#1b1307;font-weight:700;font-size:18px;padding:0 22px}
  .go:disabled{opacity:.5}
  .ex{color:var(--sub);font-size:13px;margin:10px 2px 0}
  .msg{min-height:26px;margin:16px 2px 0;font-size:15px}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--red)}
  h2{font-size:14px;color:var(--sub);font-weight:600;margin:26px 2px 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--text);padding:9px 12px;font-size:14px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row small{color:var(--sub)}
  .login{width:100%;background:#fff;color:#1f1f1f;padding:15px;font-weight:600;font-size:16px;margin-top:6px}
  .open{display:block;text-align:center;color:var(--gold);margin-top:26px;font-size:14px;text-decoration:none}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>✍️ Ghi chi nhanh</h1>
  <p class="sub" id="who">Đang tải…</p>

  <section id="loginBox" class="hidden">
    <p style="margin:0 0 10px">Đăng nhập <b>cùng tài khoản Google</b> bạn dùng trong Sổ Thu Chi (chỉ cần làm 1 lần).</p>
    <button class="login" id="loginBtn">Đăng nhập bằng Google</button>
  </section>

  <section id="formBox" class="hidden">
    <form class="box" id="f" autocomplete="off">
      <input id="t" type="text" enterkeyhint="send" placeholder="vd: phở 40k" maxlength="200" autocomplete="off" autocorrect="off">
      <button class="go" id="go" type="submit">Ghi</button>
    </form>
    <p class="ex">Gõ như nói chuyện: “cafe 35k”, “xăng 80k hôm qua”, “lương 15tr”. Bấm 🎤 trên bàn phím để nói.</p>
    <div class="msg" id="msg"></div>

    <div id="chipWrap" class="hidden">
      <h2>Ghi lại nhanh</h2>
      <div class="chips" id="chips"></div>
    </div>

    <div id="histWrap" class="hidden">
      <h2>Vừa ghi (sẽ vào sổ khi mở Sổ Thu Chi)</h2>
      <div class="list" id="hist"></div>
    </div>
  </section>

  <a class="open" href="../">Mở Sổ Thu Chi →</a>
</main>

<script type="module">
import "../cloud.js?v=57";

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function stamp() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

function show(text, cls) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (cls || ''); }

function render() {
  const hist = store.get('ghi_hist', []);
  const pend = store.get('ghi_pending', []);
  const rows = pend.map(x => ({ ...x, wait: true })).concat(hist).slice(0, 8);
  $('histWrap').classList.toggle('hidden', !rows.length);
  $('hist').innerHTML = rows.map(x => '<div class="row"><span>' + esc(x.t) + '</span><small>' + (x.wait ? '⏳ chờ mạng' : esc(x.d.slice(11) || '')) + '</small></div>').join('');
  /* các khoản hay ghi → bấm 1 lần để ghi lại */
  const cnt = {};
  store.get('ghi_all', []).forEach(t => { cnt[t] = (cnt[t] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 6);
  $('chipWrap').classList.toggle('hidden', !top.length);
  $('chips').innerHTML = top.map(t => '<button class="chip" type="button" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('');
}

function remember(item) {
  const hist = store.get('ghi_hist', []); hist.unshift(item); store.set('ghi_hist', hist.slice(0, 20));
  const all = store.get('ghi_all', []); all.unshift(item.t.toLowerCase().trim()); store.set('ghi_all', all.slice(0, 60));
}

async function sendOne(item) { await window.Cloud.inboxSend(item.t, item.d); }

async function flushPending() {
  const pend = store.get('ghi_pending', []);
  if (!pend.length || !navigator.onLine || !window.Cloud || !window.Cloud.isLoggedIn()) return;
  const left = [];
  for (const it of pend) { try { await sendOne(it); remember(it); } catch (e) { left.push(it); } }
  store.set('ghi_pending', left);
  if (left.length < pend.length) show('✓ Đã gửi ' + (pend.length - left.length) + ' khoản còn chờ', 'ok');
  render();
}

async function submit(text) {
  text = String(text || '').trim();
  if (!text) { $('t').focus(); return; }
  if (!/\d/.test(text)) { show('Bạn thêm số tiền nhé, vd “' + text + ' 35k”', 'err'); return; }
  const item = { t: text, d: stamp() };
  $('go').disabled = true; show('Đang gửi…');
  try {
    if (!navigator.onLine) throw new Error('OFFLINE');
    await sendOne(item);
    remember(item);
    $('t').value = '';
    show('✓ Đã ghi: ' + text, 'ok');
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (e) {
    const pend = store.get('ghi_pending', []); pend.push(item); store.set('ghi_pending', pend);
    $('t').value = '';
    show(e && e.message === 'OFFLINE' ? '⏳ Chưa có mạng. Đã lưu tạm, sẽ tự gửi khi có mạng.' : '⏳ Chưa gửi được, sẽ thử lại khi mở trang lần sau.', 'err');
  } finally { $('go').disabled = false; render(); }
}

$('f').addEventListener('submit', e => { e.preventDefault(); submit($('t').value); $('t').blur(); });
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { $('t').value = b.dataset.t; $('t').focus(); show('Sửa số tiền nếu cần rồi bấm Ghi'); } });
$('loginBtn').addEventListener('click', async () => {
  $('loginBtn').disabled = true;
  try { await window.Cloud.signInGoogle(); }
  catch (e) { const c = (e && e.code) || ''; if (!/cancel|closed/.test(c)) alert('Đăng nhập chưa được: ' + (e.message || e)); }
  finally { $('loginBtn').disabled = false; }
});

function onAuth() {
  const C = window.Cloud; const inn = C && C.isLoggedIn();
  $('who').textContent = inn ? ('Đang ghi vào sổ của ' + C.currentEmail()) : 'Chưa đăng nhập';
  $('loginBox').classList.toggle('hidden', !!inn);
  $('formBox').classList.toggle('hidden', !inn);
  if (inn) { render(); flushPending(); setTimeout(() => $('t').focus(), 150); }
}
window.addEventListener('cloud-auth-changed', onAuth);
window.addEventListener('cloud-login-error', ev => { const e = ev.detail && ev.detail.error; if (e) alert('Đăng nhập chưa được: ' + (e.message || e)); });
window.addEventListener('online', flushPending);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && window.Cloud && window.Cloud.isLoggedIn()) { flushPending(); $('t').focus(); } });
render();
</script>
</body>
</html>
