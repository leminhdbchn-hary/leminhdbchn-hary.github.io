const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => { const p = String(n||"").trim().split(/\s+/); return ((p.length>1?p[p.length-2][0]:"")+(p[p.length-1]||"?")[0]).toUpperCase(); };
const shortName = n => { const p = String(n||"").trim().split(/\s+/); return p.slice(-2).join(" "); };
const isFemale = m => /n[ữu]/i.test(m.gender||"");
const fmtDate = d => { if(!d) return ""; const [y,mo,da] = d.split("-"); return da && mo ? `${da}/${mo}/${y}` : d; };

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

/* ---------- write queue: one write at a time per document ---------- */
const queues = new Map();
function write(path, fn){
  const prev = queues.get(path) || Promise.resolve();
  const next = prev.catch(()=>{}).then(fn).catch(e => {
    if (e && e.code === "invalid_argument") { S.canWrite = false; render(); toast("Bạn chỉ có quyền xem trang này."); }
    else if (e && e.code === "quota_exceeded") toast("Bộ nhớ đã đầy, hãy xóa bớt dữ liệu cũ.");
    else toast("Chưa lưu được, thử lại sau ít phút.");
    throw e;
  });
  queues.set(path, next); return next;
}

/* ---------- derived stats ---------- */
function doneActs(){ return S.activities.filter(a => a.status !== "upcoming").sort(byActOrder); }
function upActs(){ return S.activities.filter(a => a.status === "upcoming").sort(byActOrder); }
function byActOrder(a,b){ return ((a.order??0)-(b.order??0)) || (a.date||"").localeCompare(b.date||""); }
function activeMembers(){ return S.members.filter(m => m.status !== "leave"); }

function stats(){
  const done = doneActs();
  const map = new Map();
  for (const m of S.members) map.set(m.id, { m, stars:0, count:0, acts:[], lastIdx:-1, planned:[] });
  done.forEach((a, i) => (a.participants||[]).forEach(id => { const s = map.get(id); if(!s) return; s.stars += Number(a.stars)||0; s.count++; s.acts.push(a); s.lastIdx = i; }));
  for (const a of upActs()) (a.participants||[]).forEach(id => { const s = map.get(id); if (s) s.planned.push(a); });
  for (const s of map.values()) s.missed = done.length - 1 - s.lastIdx; // hoạt động liên tiếp đã lỡ
  return map;
}
function priorityList(st){
  return activeMembers().map(m => st.get(m.id)).sort((x,y) => x.stars-y.stars || y.missed-x.missed || x.count-y.count || x.m.name.localeCompare(y.m.name,"vi"));
}

/* ---------- render ---------- */
function render(){
  const ready = S.loaded.m && S.loaded.a;
  const app = $("#app");
  if (!db && !PUB) { app.innerHTML = `<div class="state"><b>Chưa kết nối được kho dữ liệu</b>Hãy mở trang khi đã đăng nhập claude.ai để xem và cập nhật danh sách đoàn viên.</div>`; return; }
  if (!ready) return;
  const st = stats();
  renderKpis(st);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === S.view)));
  const scrollY = window.scrollY;
  if (S.view === "tong-quan") app.innerHTML = viewOverview(st);
  else if (S.view === "hoat-dong") app.innerHTML = viewActivities(st);
  else if (S.view === "diem-danh") app.innerHTML = viewMatrix(st);
  else app.innerHTML = viewMembers(st);
  const si = $("#mem-search"); if (si && document.activeElement !== si && S._focusSearch) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); S._focusSearch=false; }
  window.scrollTo(0, scrollY);
}

function renderKpis(st){
  const act = activeMembers();
  const total = [...st.values()].reduce((s,x)=>s+x.stars,0);
  const zero = act.filter(m => st.get(m.id).stars === 0).length;
  const vals = [S.members.length, doneActs().length, total, zero];
  document.querySelectorAll("#kpis .kpi b").forEach((b,i) => b.textContent = vals[i]);
}

function memberLine(s, extra=""){
  const m = s.m;
  return `<div class="avatar ${isFemale(m)?"f":""}" aria-hidden="true">${esc(initials(m.name))}</div>
    <div class="who"><div class="n">${esc(m.name)}</div>${extra}</div>`;
}

function viewOverview(st){
  const target = Number(S.settings.targetStars)||3;
  const ranked = [...st.values()].filter(s => s.m.status!=="leave").sort((a,b)=> b.stars-a.stars || b.count-a.count || a.m.name.localeCompare(b.m.name,"vi"));
  const max = Math.max(target, ...ranked.map(r=>r.stars), 1);
  let rank = 0, prev = null;
  const lb = ranked.map((s,i) => {
    if (s.stars !== prev) { rank = i+1; prev = s.stars; }
    const acts = s.acts.length ? s.acts.map(a=>a.name).join(" · ") : "Chưa tham gia hoạt động nào";
    return `<li class="${rank<=3 && s.stars>0?"top":""}"><span class="rank">${rank}</span>
      <div class="who"><div class="n">${esc(s.m.name)}</div><div class="acts">${esc(acts)}</div>
      <div class="bar"><i style="width:${Math.min(100, s.stars/max*100)}%"></i></div></div>
      <span class="starcount">${s.stars}${STAR}</span></li>`;
  }).join("");

  const pr = priorityList(st);
  const none = pr.filter(s => s.stars === 0);
  const below = pr.filter(s => s.stars > 0 && s.stars < target);
  const done = doneActs().length;
  const sg = (s, cls) => {
    const missTxt = s.count === 0 ? `Chưa tham gia hoạt động nào` : `Lần gần nhất: ${esc(s.acts[s.acts.length-1].name)}`;
    const pills = [];
    if (s.count === 0) pills.push(`<span class="pill warn">0 sao</span>`);
    else pills.push(`<span class="pill star">${s.stars}/${target} sao</span>`);
    if (s.count > 0 && s.missed >= 2) pills.push(`<span class="pill grey">lỡ ${s.missed} hoạt động</span>`);
    if (s.planned.length) pills.push(`<span class="pill blue">Đã cử: ${esc(s.planned[0].name)}</span>`);
    if (!PUB && !s.m.fee) pills.push(`<span class="pill grey">Chưa đóng đoàn phí</span>`);
    return `<div class="sg ${cls}">${memberLine(s, `<div class="acts">${missTxt}</div>`)}<div class="chips" style="justify-content:flex-end">${pills.join("")}</div></div>`;
  };
  const leave = S.members.filter(m => m.status === "leave");
  const reached = pr.filter(s => s.stars >= target).length;

  return `<div class="view">
    <div class="rules">
      <span><b>Nguyên tắc:</b> tham gia 1 hoạt động = nhận số sao của hoạt động đó (thường 1 sao, cuộc thi lớn có thể nhiều sao hơn).</span>
      <span class="target"><label for="target">Chỉ tiêu mỗi đoàn viên</label>
        <input id="target" type="number" min="1" max="50" value="${target}" ${S.canWrite?"":"disabled"}> sao</span>
    </div>
    <div class="grid2">
      <section class="panel">
        <div class="panel-h"><div><h2>Cần tham gia hoạt động tiếp theo</h2>
          <div class="sub">Xếp theo ít sao nhất, rồi đến người đã lâu chưa tham gia. ${reached}/${pr.length} đoàn viên đã đạt chỉ tiêu.</div></div>
          ${S.canWrite?`<button class="btn primary" data-act="new-activity">+ Hoạt động sắp tới</button>`:""}</div>
        <div class="panel-b">
          ${none.length?`<div class="group"><h3><span class="dot" style="background:var(--warn)"></span>Ưu tiên cử ngay · chưa có sao (${none.length})</h3><div class="sugg">${none.map(s=>sg(s,"hi")).join("")}</div></div>`:""}
          ${below.length?`<div class="group"><h3><span class="dot" style="background:var(--star)"></span>Chưa đạt chỉ tiêu ${target} sao (${below.length})</h3><div class="sugg">${below.map(s=>sg(s,"mid")).join("")}</div></div>`:""}
          ${!none.length && !below.length ? `<div class="empty">Tất cả đoàn viên đã đạt chỉ tiêu. Có thể nâng chỉ tiêu để tiếp tục phân bổ đều.</div>`:""}
          ${leave.length?`<div class="leave">Tạm nghỉ, không tính vào đề xuất: ${leave.map(m=>`<b>${esc(m.name)}</b>${m.note?` (${esc(m.note)})`:""}`).join(", ")}</div>`:""}
        </div>
      </section>
      <section class="panel">
        <div class="panel-h"><div><h2>Bảng xếp hạng sao</h2><div class="sub">${done} hoạt động đã tổ chức</div></div></div>
        <div class="panel-b"><ol class="lb">${lb || `<li><span></span><div class="empty">Chưa có đoàn viên.</div><span></span></li>`}</ol></div>
      </section>
    </div>
  </div>`;
}

function actCard(a, st){
  const parts = (a.participants||[]).map(id => st.get(id)).filter(Boolean);
  const up = a.status === "upcoming";
  const slots = Number(a.slots)||0;
  let sugg = "";
  if (up && S.canWrite) {
    const need = Math.max(0, slots - parts.length);
    if (need > 0) {
      const picks = priorityList(st).filter(s => !(a.participants||[]).includes(s.m.id) && !s.planned.length).slice(0, need);
      const picks2 = picks.length < need ? priorityList(st).filter(s => !(a.participants||[]).includes(s.m.id) && !picks.includes(s)).slice(0, need-picks.length) : [];
      const all = picks.concat(picks2);
      if (all.length) sugg = `<div><div class="meta" style="margin-bottom:6px">Đề xuất cử thêm ${all.length} người (ít sao nhất):</div>
        <div class="chips">${all.map(s=>`<span class="chip sugg">${esc(shortName(s.m.name))} · ${s.stars}★</span>`).join("")}</div>
        <div class="act-actions" style="margin-top:8px"><button class="btn primary" data-act="assign" data-id="${a.id}" data-ids="${all.map(s=>s.m.id).join(",")}">Phân công những người này</button></div></div>`;
    }
  }
  return `<article class="act ${up?"up":""}">
    <div class="act-top"><div><h3>${esc(a.name)}</h3>
      <div class="meta">${a.type?`<span>${esc(a.type)}</span>`:""}${a.date?`<span>${fmtDate(a.date)}</span>`:""}
      <span>${up?`<b style="color:var(--doan)">Sắp diễn ra</b>${slots?` · cần ${slots} người`:""}`:"Đã diễn ra"}</span></div></div>
      <span class="stars-badge">+${Number(a.stars)||0}${STAR}</span></div>
    <div><div class="meta" style="margin-bottom:6px">${up?"Đã phân công":"Đã tham gia"}: ${parts.length} người</div>
      <div class="chips">${parts.length?parts.map(s=>`<span class="chip">${esc(shortName(s.m.name))}</span>`).join(""):`<span class="empty">Chưa có ai</span>`}</div></div>
    ${sugg}
    ${S.canWrite?`<div class="act-actions"><button class="btn" data-act="edit-activity" data-id="${a.id}">Sửa / điểm danh</button>
      ${up?`<button class="btn ghost" data-act="mark-done" data-id="${a.id}">Đánh dấu đã diễn ra → cộng sao</button>`:""}</div>`:""}
  </article>`;
}

function viewActivities(st){
  const up = upActs(), done = doneActs().reverse();
  return `<div class="view">
    <section class="panel"><div class="panel-h"><div><h2>Hoạt động sắp tới</h2><div class="sub">Nhập số người cần, trang sẽ gợi ý đoàn viên ít sao nhất. Sao chỉ được cộng khi hoạt động được đánh dấu đã diễn ra.</div></div>
      ${S.canWrite?`<button class="btn primary" data-act="new-activity">+ Thêm hoạt động</button>`:""}</div>
      <div class="panel-b">${up.length?`<div class="acts-list">${up.map(a=>actCard(a,st)).join("")}</div>`:`<div class="empty">Chưa có hoạt động sắp tới. Bấm “Thêm hoạt động”, chọn trạng thái “Sắp diễn ra” và số người cần để nhận đề xuất.</div>`}</div></section>
    <section class="panel"><div class="panel-h"><div><h2>Đã tổ chức (${done.length})</h2><div class="sub">Mới nhất ở trên</div></div>
      ${S.canWrite?`<div class="toolbar"><button class="btn" data-act="export">Xuất bảng sao (CSV)</button><button class="btn primary" data-act="export-html">Xuất trang xem (HTML)</button></div>`:""}</div>
      <div class="panel-b">${done.length?`<div class="acts-list">${done.map(a=>actCard(a,st)).join("")}</div>`:`<div class="empty">Chưa có hoạt động nào.</div>`}</div></section>
  </div>`;
}

function viewMatrix(st){
  const acts = doneActs().concat(upActs());
  const rows = S.members.slice().sort((a,b)=>(a.order??999)-(b.order??999)).map((m,i) => {
    const s = st.get(m.id);
    const cells = acts.map(a => {
      const on = (a.participants||[]).includes(m.id); const up = a.status === "upcoming";
      return `<td><button class="cell ${on?(up?"plan":"on"):""}" data-act="toggle" data-a="${a.id}" data-m="${m.id}" ${S.canWrite?"":"disabled"} aria-pressed="${on}" aria-label="${esc(m.name)} – ${esc(a.name)}">${on?STAR:""}</button></td>`;
    }).join("");
    return `<tr><td class="num">${i+1}</td><td class="name"><b>${esc(m.name)}</b>${m.status==="leave"?` <span class="pill grey">Tạm nghỉ</span>`:""}</td>${cells}<td class="total">${s.stars}</td></tr>`;
  }).join("");
  return `<div class="view"><section class="panel">
    <div class="panel-h"><div><h2>Bảng sao theo hoạt động</h2><div class="sub">Giống file Excel: mỗi cột là một hoạt động. Bấm vào ô để điểm danh hoặc bỏ điểm danh.</div></div>
      <div class="legend"><span><span class="cell on">${STAR}</span> Đã tham gia</span><span><span class="cell plan">${STAR}</span> Đã phân công (sắp tới)</span></div></div>
    <div class="mx-wrap"><table class="mx"><thead><tr><th>STT</th><th class="name">Họ và tên</th>
      ${acts.map((a,i)=>`<th class="actcol ${a.status==="upcoming"?"up":""}">HĐ ${i+1}<br>${esc(a.name)}<br><span style="color:var(--star)">+${Number(a.stars)||0}★</span></th>`).join("")}
      <th>Tổng sao</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section></div>`;
}

function viewMembers(st){
  const q = S.search.trim().toLowerCase();
  const list = S.members.slice().sort((a,b)=>(a.order??999)-(b.order??999)).filter(m => !q || (m.name||"").toLowerCase().includes(q));
  const rows = list.map((m,i) => {
    const s = st.get(m.id);
    return `<tr><td class="num">${i+1}</td>
      <td><div style="display:flex;gap:10px;align-items:center"><div class="avatar ${isFemale(m)?"f":""}" aria-hidden="true">${esc(initials(m.name))}</div><div><div class="n">${esc(m.name)}</div>${PUB?"":`<div style="font-size:12px;color:var(--muted)">${esc(m.email||"")}</div>`}</div></div></td>
      <td class="c">${esc(m.gender||"")}</td>${PUB?"":`<td class="c num">${esc(m.dob||"")}</td><td class="c num">${esc(m.phone||"")}</td>
      <td class="c">${m.fee?`<span class="pill ok">Đã đóng</span>`:`<span class="pill warn">Chưa đóng</span>`}</td>`}
      <td class="c">${m.status==="leave"?`<span class="pill grey">Tạm nghỉ${m.note?" · "+esc(m.note):""}</span>`:`<span class="pill blue">Đang sinh hoạt</span>`}</td>
      <td class="c"><span class="starcount" style="font-size:14px">${s.stars}${STAR}</span></td>
      <td class="c">${S.canWrite?`<button class="btn" data-act="edit-member" data-id="${m.id}">Sửa</button>`:""}</td></tr>`;
  }).join("");
  return `<div class="view"><section class="panel">
    <div class="panel-h"><div><h2>Danh sách đoàn viên (${S.members.length})</h2><div class="sub">Chi đoàn 6 · Chi bộ 20</div></div>
      <div class="toolbar"><input type="text" id="mem-search" placeholder="Tìm theo tên…" value="${esc(S.search)}" aria-label="Tìm đoàn viên">
      ${S.canWrite?`<button class="btn primary" data-act="new-member">+ Thêm đoàn viên</button>`:""}</div></div>
    <div class="mx-wrap"><table class="mem"><thead><tr><th>STT</th><th>Họ và tên</th><th>Giới tính</th>${PUB?"":"<th>Ngày sinh</th><th>SĐT</th><th>Đoàn phí</th>"}<th>Trạng thái</th><th>Sao</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="${PUB?6:9}" class="empty">Không tìm thấy đoàn viên.</td></tr>`}</tbody></table></div>
  </section></div>`;
}

/* ---------- modals ---------- */
function openModal(title, body, onSave, onDelete){
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="modal-h"><h2 id="mt">${esc(title)}</h2><button type="button" data-close aria-label="Đóng">×</button></div>
    <form id="mf"><div class="modal-b">${body}<div class="err" id="merr"></div></div>
    <div class="modal-f">${onDelete?`<button type="button" class="btn danger" id="mdel">Xóa</button>`:""}<div class="r"><button type="button" class="btn" data-close>Hủy</button><button type="submit" class="btn primary">Lưu</button></div></div></form></div></div>`;
  const close = () => root.innerHTML = "";
  root.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") close(); });
  document.addEventListener("keydown", function k(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",k);} });
  $("#mf").onsubmit = async e => { e.preventDefault(); const err = onSave(new FormData(e.target), e.target); if (typeof err === "string") { $("#merr").textContent = err; return; } close(); };
  const del = $("#mdel");
  if (del) del.onclick = () => { if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Bấm lần nữa để xóa"; return; } onDelete(); close(); };
  const first = root.querySelector("input,select"); first && first.focus();
}

function activityForm(a){
  const st = stats();
  a = a || { name:"", type:"Sự kiện", date:"", stars:1, status:"upcoming", slots:3, participants:[] };
  const sel = new Set(a.participants||[]);
  const pr = priorityList(st);
  const ordered = pr.concat(S.members.filter(m=>m.status==="leave").map(m=>st.get(m.id)));
  const checks = ordered.map(s => `<label><input type="checkbox" name="p" value="${s.m.id}" ${sel.has(s.m.id)?"checked":""}>${esc(s.m.name)}<span class="hint">${s.m.status==="leave"?"nghỉ":s.stars+"★"}</span></label>`).join("");
  const body = `<div class="form-grid">
    <div class="field full"><label for="f-name">Tên hoạt động</label><input type="text" id="f-name" name="name" required value="${esc(a.name)}" placeholder="VD: Hiến máu nhân đạo tháng 11"></div>
    <div class="field"><label for="f-type">Loại</label><select id="f-type" name="type">${TYPES.map(t=>`<option ${t===a.type?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="field"><label for="f-date">Ngày</label><input type="date" id="f-date" name="date" value="${esc(a.date||"")}"></div>
    <div class="field"><label for="f-stars">Số sao khi tham gia</label><input type="number" id="f-stars" name="stars" min="0" max="20" value="${Number(a.stars)||0}"></div>
    <div class="field"><label for="f-status">Trạng thái</label><select id="f-status" name="status"><option value="upcoming" ${a.status==="upcoming"?"selected":""}>Sắp diễn ra</option><option value="done" ${a.status!=="upcoming"?"selected":""}>Đã diễn ra (cộng sao)</option></select></div>
    <div class="field"><label for="f-slots">Số người cần</label><input type="number" id="f-slots" name="slots" min="0" max="100" value="${Number(a.slots)||0}"></div>
    <div class="field full"><label>Người tham gia / được phân công <span style="color:var(--muted);font-weight:400">(xếp theo ưu tiên: ít sao ở trên)</span></label><div class="check-list">${checks}</div></div>
  </div>`;
  return body;
}

function editActivity(id){
  const a = id ? S.activities.find(x=>x.id===id) : null;
  openModal(a?"Sửa hoạt động":"Thêm hoạt động", activityForm(a), (fd) => {
    const name = String(fd.get("name")||"").trim(); if (!name) return "Hãy nhập tên hoạt động.";
    const data = { name, type: fd.get("type"), date: fd.get("date")||"", stars: Math.max(0, Number(fd.get("stars"))||0),
      status: fd.get("status"), slots: Math.max(0, Number(fd.get("slots"))||0), participants: fd.getAll("p"),
      order: a ? (a.order ?? 0) : (Math.max(0,...S.activities.map(x=>x.order||0))+1) };
    const ref = a ? db.collection("activities").doc(a.id) : db.collection("activities").doc();
    write(ref.path, () => ref.set(data)).then(()=>toast(a?"Đã lưu hoạt động":"Đã thêm hoạt động"));
  }, a ? () => { const ref = db.collection("activities").doc(a.id); write(ref.path, ()=>ref.delete()).then(()=>toast("Đã xóa hoạt động")); } : null);
}

function editMember(id){
  const m = id ? S.members.find(x=>x.id===id) : { name:"", gender:"Nữ", dob:"", email:"", phone:"", fee:true, status:"active", note:"" };
  const body = `<div class="form-grid">
    <div class="field full"><label for="m-name">Họ và tên</label><input type="text" id="m-name" name="name" required value="${esc(m.name)}"></div>
    <div class="field"><label for="m-gender">Giới tính</label><select id="m-gender" name="gender">${["Nam","Nữ"].map(g=>`<option ${(m.gender||"").trim()===g?"selected":""}>${g}</option>`).join("")}</select></div>
    <div class="field"><label for="m-dob">Ngày sinh</label><input type="text" id="m-dob" name="dob" value="${esc(m.dob)}" placeholder="dd/mm/yyyy"></div>
    <div class="field"><label for="m-email">Email</label><input type="email" id="m-email" name="email" value="${esc(m.email)}"></div>
    <div class="field"><label for="m-phone">Số điện thoại</label><input type="tel" id="m-phone" name="phone" value="${esc(m.phone)}"></div>
    <div class="field"><label for="m-fee">Đoàn phí</label><select id="m-fee" name="fee"><option value="1" ${m.fee?"selected":""}>Đã đóng</option><option value="0" ${!m.fee?"selected":""}>Chưa đóng</option></select></div>
    <div class="field"><label for="m-status">Trạng thái</label><select id="m-status" name="status"><option value="active" ${m.status!=="leave"?"selected":""}>Đang sinh hoạt</option><option value="leave" ${m.status==="leave"?"selected":""}>Tạm nghỉ (không đề xuất)</option></select></div>
    <div class="field full"><label for="m-note">Ghi chú</label><input type="text" id="m-note" name="note" value="${esc(m.note)}" placeholder="VD: Nghỉ thai sản"></div>
  </div>`;
  openModal(id?"Sửa đoàn viên":"Thêm đoàn viên", body, fd => {
    const name = String(fd.get("name")||"").trim(); if (!name) return "Hãy nhập họ tên.";
    const data = { name, gender: fd.get("gender"), dob: String(fd.get("dob")||"").trim(), email: String(fd.get("email")||"").trim(), phone: String(fd.get("phone")||"").trim(),
      fee: fd.get("fee")==="1", status: fd.get("status"), note: String(fd.get("note")||"").trim(),
      order: id ? (m.order ?? 0) : (Math.max(0,...S.members.map(x=>x.order||0))+1) };
    const ref = id ? db.collection("members").doc(id) : db.collection("members").doc();
    write(ref.path, ()=>ref.set(data)).then(()=>toast(id?"Đã lưu thông tin":"Đã thêm đoàn viên"));
  }, id ? () => {
    const ref = db.collection("members").doc(id);
    write(ref.path, ()=>ref.delete()).then(()=>toast("Đã xóa đoàn viên"));
    S.activities.filter(a => (a.participants||[]).includes(id)).forEach(a => { const r = db.collection("activities").doc(a.id); write(r.path, ()=>r.update({ participants: a.participants.filter(x=>x!==id) })); });
  } : null);
}

function setParticipants(aid, list){
  const a = S.activities.find(x=>x.id===aid); if (!a) return;
  a.participants = list; render(); // optimistic
  const r = db.collection("activities").doc(aid);
  return write(r.path, ()=>r.update({ participants: list }));
}

async function exportCsv(){
  const st = stats(); const acts = doneActs();
  const head = ["STT","Họ và tên","Giới tính","Ngày sinh", ...acts.map((a,i)=>`HĐ ${i+1}: ${a.name} (+${a.stars} sao)`), "Tổng sao","Đoàn phí","Ghi chú"];
  const rows = S.members.slice().sort((a,b)=>(a.order??999)-(b.order??999)).map((m,i)=>[i+1,m.name,m.gender,m.dob,...acts.map(a=>(a.participants||[]).includes(m.id)?"x":""),st.get(m.id).stars,m.fee?"x":"",m.note||""]);
  const csv = "﻿" + [head,...rows].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  if (!downloads) { toast("Trình xem này chưa hỗ trợ tải file."); return; }
  try { const r = await downloads.save({ filename: "NgoisaoDTN_PTSPBL.csv", data: csv }); if (r && r.status==="saved") toast("Đã tải bảng sao"); }
  catch(e){ if (e && e.code !== "cancelled") toast("Chưa tải được file."); }
}

/* ---------- bản HTML chỉ xem (không kèm SĐT, email, ngày sinh, đoàn phí, ghi chú) ---------- */
function buildSnapshot(){
  const data = { at: new Date().toISOString(), settings: { targetStars: Number(S.settings.targetStars)||3 },
    members: S.members.map(m => ({ id:m.id, name:m.name, gender:m.gender||"", status:m.status||"active", order:m.order ?? 0, fee:true })),
    activities: S.activities.map(a => ({ id:a.id, name:a.name, type:a.type||"", date:a.date||"", stars:Number(a.stars)||0, status:a.status, slots:Number(a.slots)||0, participants:[...(a.participants||[])], order:a.order ?? 0 })) };
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  const base = '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>';
  return '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>NgoisaoDTN_PTSPBL</title>'
    + SHELL.font + base + SHELL.style + '</head><body>' + SHELL.body
    + '<main class="wrap" id="app"></main><div id="modal-root"></div><script>window.__SNAPSHOT__=' + json + ';<\/script><script id="app-js">' + SHELL.js + '<\/script></body></html>';
}
window.__buildSnapshot = buildSnapshot;
async function exportHtml(){
  if (!downloads) { toast("Trình xem này chưa hỗ trợ tải file."); return; }
  try { const r = await downloads.save({ filename: "NgoisaoDTN_PTSPBL.html", data: buildSnapshot() }); if (r && r.status==="saved") toast("Đã tải trang xem"); }
  catch(e){ if (e && e.code !== "cancelled") toast("Chưa tải được file."); }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) { location.hash = tab.dataset.view; return; }
  const b = e.target.closest("[data-act]"); if (!b || !db) return;
  const act = b.dataset.act;
  if (act === "new-activity") editActivity(null);
  else if (act === "edit-activity") editActivity(b.dataset.id);
  else if (act === "new-member") editMember(null);
  else if (act === "edit-member") editMember(b.dataset.id);
  else if (act === "export") exportCsv();
  else if (act === "export-html") exportHtml();
  else if (act === "assign") { const a = S.activities.find(x=>x.id===b.dataset.id); if (a) setParticipants(a.id, [...new Set([...(a.participants||[]), ...b.dataset.ids.split(",")])])?.then(()=>toast("Đã phân công")); }
  else if (act === "mark-done") { const a = S.activities.find(x=>x.id===b.dataset.id); if (!a) return; a.status="done"; if(!a.date) a.date = new Date().toISOString().slice(0,10); render(); const r = db.collection("activities").doc(a.id); write(r.path, ()=>r.update({ status:"done", date:a.date })).then(()=>toast(`Đã cộng ${a.stars} sao cho ${(a.participants||[]).length} đoàn viên`)); }
  else if (act === "toggle") { const a = S.activities.find(x=>x.id===b.dataset.a); if (!a) return; const id = b.dataset.m; const cur = a.participants||[]; setParticipants(a.id, cur.includes(id) ? cur.filter(x=>x!==id) : [...cur, id]); }
});
let tgtTimer;
document.addEventListener("input", e => {
  if (e.target.id === "mem-search") { S.search = e.target.value; S._focusSearch = true; render(); }
  if (e.target.id === "target") { clearTimeout(tgtTimer); const v = Math.max(1, Number(e.target.value)||0); if (!v) return;
    tgtTimer = setTimeout(() => { S.settings.targetStars = v; const r = db.doc("config/settings"); write(r.path, ()=>r.set({ ...S.settings, targetStars: v })); render(); }, 600); }
});
function route(){ const h = location.hash.slice(1); S.view = ["tong-quan","hoat-dong","diem-danh","doan-vien"].includes(h) ? h : "tong-quan"; render(); }
window.addEventListener("hashchange", route);

/* ---------- boot ---------- */
async function boot(){
  const sync = $("#sync");
  if (PUB) {
    S.members = SNAP.members; S.activities = SNAP.activities; S.settings = SNAP.settings || { targetStars: 3 };
    S.loaded = { m:true, a:true, s:true }; S.canWrite = false;
    const d = new Date(SNAP.at); sync.textContent = "Cập nhật " + d.toLocaleString("vi-VN", { hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit", year:"numeric" });
    route(); return;
  }
  route();
  db = await (window.claude?.use ? claude.use("db") : Promise.resolve(null)).catch(()=>null);
  if (!db) { sync.textContent = "Ngoại tuyến"; render(); return; }
  downloads = await claude.use("downloads").catch(()=>null);
  claude.use("user").then(async u => { if (!u) return; const c = await u.can("data.write"); if (c === false) { S.canWrite = false; render(); } }).catch(()=>{});
  const timer = setTimeout(() => { sync.textContent = "Chưa kết nối được dữ liệu"; }, 10000);
  const onErr = () => { clearTimeout(timer); sync.textContent = "Mất kết nối dữ liệu"; };
  const done = (meta) => { if (!meta.fromCache) { clearTimeout(timer); sync.textContent = "Đã đồng bộ"; } };
  db.collection("members").onSnapshot(snap => { S.members = snap.docs.map(d => ({ id:d.id, ...d.data() })); S.loaded.m = true; done(snap.metadata); render(); }, onErr);
  db.collection("activities").onSnapshot(snap => { S.activities = snap.docs.map(d => ({ id:d.id, ...d.data(), participants:[...(d.data().participants||[])] })); S.loaded.a = true; done(snap.metadata); render(); }, onErr);
  db.doc("config/settings").onSnapshot(snap => { if (snap.exists) S.settings = { ...snap.data() }; S.loaded.s = true; if (document.activeElement?.id !== "target") render(); }, onErr);
}
boot();

/* ---------- hero: drifting stars ---------- */
(function sky(){
  const c = $("#sky"); const ctx = c.getContext("2d"); let w,h,stars=[];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ const r = c.getBoundingClientRect(); w = c.width = r.width*devicePixelRatio; h = c.height = r.height*devicePixelRatio;
    stars = Array.from({length: Math.round(r.width/22)}, () => ({ x:Math.random()*w, y:Math.random()*h, s:(Math.random()*2+1)*devicePixelRatio, p:Math.random()*6.28 })); }
  function star(x,y,r){ ctx.beginPath(); for(let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5; const rr = i%2? r*.45 : r; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
  function draw(t){ ctx.clearRect(0,0,w,h); for (const s of stars){ const a = .35 + .45*Math.sin(t/900 + s.p); ctx.fillStyle = `rgba(255,214,90,${a})`; star(s.x, s.y, s.s*2.2); } if(!reduce) requestAnimationFrame(draw); }
  size(); addEventListener("resize", size); requestAnimationFrame(draw);
})();
})();
</script></body></html>
